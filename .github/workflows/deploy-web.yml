name: Deploy web

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-web.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and push changectl-web image
        env:
          IMAGE: us-central1-docker.pkg.dev/${{ vars.CHANGECTL_PROJECT }}/changectl/changectl-web:latest
        run: |
          docker build -t "$IMAGE" web/
          docker push "$IMAGE"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy changectl-web \
            --image us-central1-docker.pkg.dev/${{ vars.CHANGECTL_PROJECT }}/changectl/changectl-web:latest \
            --region us-central1 \
            --project ${{ vars.CHANGECTL_PROJECT }}

      - name: Smoke test deployed service
        run: |
          SERVICE_URL=$(gcloud run services describe changectl-web \
            --region us-central1 --project ${{ vars.CHANGECTL_PROJECT }} \
            --format='value(status.url)')
          STATUS=$(curl -fsS -o /dev/null -w '%{http_code}' "$SERVICE_URL/signin")
          test "$STATUS" = "200"
